<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資與貸款追蹤 PWA</title>
    <!-- 引入 Tailwind CSS 讓介面現代化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-24">

    <!-- 頂部標題列 -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400">💰 投資與貸款追蹤器</h1>
        <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full">PWA 運行中</span>
    </header>

    <!-- 主要內容區 -->
    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- 總資產卡片 -->
        <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
            <h2 class="text-sm text-slate-400">槓桿組合總市值</h2>
            <div class="text-3xl font-extrabold text-white mt-1">$212,360 <span class="text-xs text-slate-400 font-normal">TWD</span></div>
            <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between text-sm">
                <span>維持率安全防線</span>
                <span class="text-emerald-400 font-bold">✅ 穩定 (>160%)</span>
            </div>
        </section>

        <!-- 持倉清單 -->
        <section class="space-y-3">
            <h3 class="text-lg font-semibold text-slate-200">持倉與加碼狀態</h3>
            
            <!-- 卡片 1 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                <div>
                    <div class="font-bold text-lg">TPE:00631L</div>
                    <div class="text-xs text-slate-400">現價: 35.44 | 股數: 5,062</div>
                </div>
                <div class="text-right">
                    <span class="inline-block px-2 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-md">✅ 比例穩定</span>
                    <div class="text-xs text-slate-400 mt-1">目標: 80%</div>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                <div>
                    <div class="font-bold text-lg">TPE:00713</div>
                    <div class="text-xs text-slate-400">現價: 59.50 | 股數: 554</div>
                </div>
                <div class="text-right">
                    <span class="inline-block px-2 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-md">✅ 比例穩定</span>
                    <div class="text-xs text-slate-400 mt-1">目標: 20%</div>
                </div>
            </div>
        </section>

        <!-- 貸款試算模組 -->
        <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h3 class="text-lg font-semibold text-slate-200">簡易貸款 / 質押利息試算</h3>
            <div>
                <label class="text-xs text-slate-400">貸款本金 (TWD)</label>
                <input type="number" value="500000" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="text-xs text-slate-400">年利率 (%)</label>
                <input type="number" value="2.35" step="0.01" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
            </div>
        </section>

    </main>

    <!-- 底部導航列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 p-3 flex justify-around text-xs text-slate-400">
        <button class="text-emerald-400 font-bold flex flex-col items-center">
            <span>📊</span>總覽
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span>📝</span>交易紀錄
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span>🧮</span>貸款計算
        </button>
    </nav>

</body>
</html>
